version: 0.1.43+44
environment:
  sdk: ^3.13.1
dependencies:
  flutter:
    sdk: flutter
  file_selector: 1.1.0
  audio_service: 0.18.19
  audio_session: 0.2.4
  media_kit_libs_android_audio: 1.3.8
