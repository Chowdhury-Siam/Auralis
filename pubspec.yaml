name: auralis
description: Independent, compact Android and Windows music player with TDLib Telegram browsing.
publish_to: none
version: 0.1.152+153
environment:
  sdk: ^3.13.1
dependencies:
  flutter:
    sdk: flutter
  file_selector: 1.1.0
  audio_service: 0.18.19
  audio_session: 0.2.4
  media_kit_libs_android_video: 1.3.8
  ffi: 2.2.0
  path: 1.9.1
  path_provider: 2.1.6
  package_info_plus: 10.2.1
  crypto: 3.0.7
  cryptography: 2.9.0
  media_kit: 1.2.6
  media_kit_video: 2.0.1
  media_kit_libs_windows_video: 1.0.11
dependency_overrides:
  media_kit:
    path: third_party/media_kit
  media_kit_video:
    path: third_party/media_kit_video
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  yaml: 3.1.4
flutter:
  uses-material-design: true
  assets:
    - assets/release-notes.json
    - assets/fonts/DejaVuSans.ttf
    - assets/shaders/anime4k/
    - assets/shaders/hdr-toys/
    - assets/shaders/hdr-toys/utils/
    - assets/shaders/hdr-toys/transfer-function/
    - assets/shaders/hdr-toys/tone-mapping/
    - assets/shaders/hdr-toys/gamut-mapping/
    - cloud/worker/worker.mjs
    - cloud/worker/turso.mjs
    - cloud/worker/accounts.mjs
    - cloud/worker/schema.sql
