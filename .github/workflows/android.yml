name: Android APK build
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      architecture:
        description: APK architecture
        type: choice
        options: [arm64-v8a, x86_64]
        default: arm64-v8a
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}-${{ inputs.architecture || 'arm64-v8a' }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      signed: ${{ steps.signing.outputs.signed }}
    env:
      ABI: ${{ inputs.architecture || 'arm64-v8a' }}
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      DART_SUPPRESS_ANALYTICS: 'true'
      JOBS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle.kts
            android/gradle/wrapper/gradle-wrapper.properties
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
          pub-cache: true
      - name: Install Android and host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build gperf libssl-dev zlib1g-dev
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check release notes, sync service and workflow policy
        run: |
          python tool/release-notes.py
          node --test cloud/worker/worker.test.mjs tool/release-policy.test.cjs
      - name: Static analysis
        run: flutter analyze --no-pub --fatal-infos
      - name: Automated tests
        run: |
          flutter test --no-pub --reporter expanded
          python3 tool/verify-android.py --source-only
          python3 -m unittest discover -s tool -p 'test_android*.py'
      - name: Restore compiled Android TDLib
        id: tdlib
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          key: tdlib-android-ubuntu24-v1-${{ env.ABI }}-${{ hashFiles('tool/build-tdlib-android.sh') }}
          path: |
            android/app/src/main/jniLibs/
            native/android/
      - name: Build Android TDLib from pinned sources
        if: steps.tdlib.outputs.cache-hit != 'true'
        run: bash tool/build-tdlib-android.sh "$ABI"
      - name: Save compiled Android TDLib
        if: steps.tdlib.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          key: ${{ steps.tdlib.outputs.cache-primary-key }}
          path: |
            android/app/src/main/jniLibs/
            native/android/
      - name: Configure automatic APK signing
        id: signing
        env:
          SIGNING_IDENTITY: ${{ github.event_name != 'pull_request' && secrets.ANDROID_SIGNING_IDENTITY || '' }}
          KEYSTORE: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          STORE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          KEY_ALIAS: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEY_ALIAS || '' }}
          KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: |
          python3 tool/android-signing.py
      - name: Build Android APK
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          if [ "$ABI" = arm64-v8a ]; then target=android-arm64; else target=android-x64; fi
          if [ "$SIGNED" = true ]; then flavor=release; else flavor=development-release; fi
          # --target-platform alone can leave third-party native libraries for
          # other ABIs in the APK; Flutter's ABI split enforces a single ABI.
          flutter build apk --release --no-pub --split-per-abi --target-platform "$target"
          mkdir -p dist/android
          version=$(sed -n 's/^version: \([^+]*\)+.*/\1/p' pubspec.yaml)
          source_apk="build/app/outputs/flutter-apk/app-$ABI-release.apk"
          test -f "$source_apk" || { echo "Missing split APK: $source_apk" >&2; exit 1; }
          cp "$source_apk" "dist/android/auralis-$version-android-$ABI-$flavor.apk"
          python3 tool/verify-android.py "dist/android/auralis-$version-android-$ABI-$flavor.apk" "$ABI"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "dist/android/auralis-$version-android-$ABI-$flavor.apk"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "dist/android/auralis-$version-android-$ABI-$flavor.apk"
          test "$(apkanalyzer manifest debuggable "dist/android/auralis-$version-android-$ABI-$flavor.apk")" = false
          cp -r native/android/licenses dist/android/
          cp native/android/build-manifest.json dist/android/
          cp THIRD_PARTY_NOTICES.md docs/ANDROID.md dist/android/
          (cd dist/android && sha256sum *.apk > SHA256SUMS.txt)
      - name: Remove temporary signing files
        if: always()
        run: rm -f android/key.properties android/auralis-release.jks
      - name: Save APK and native provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: auralis-android-${{ env.ABI }}-${{ steps.signing.outputs.signed == 'true' && 'release' || 'development' }}
          path: dist/android/
          if-no-files-found: error
      - name: Explain Android release publishing
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          if [ "$SIGNED" = true ]; then
            echo 'Signed APK saved. The separate publisher waits for matching Android arm64 and Windows main builds; optional x64 artifacts are included when available.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Optimized release APK saved with a temporary development signature. Run Set up Android signing once for automatic signing with a retained key.' >> "$GITHUB_STEP_SUMMARY"
          fi
