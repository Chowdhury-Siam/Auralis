name: Clean completed Auralis runs
on:
  workflow_dispatch:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_run:
    workflows: [Android APK build, Windows x64 build, Publish Auralis release, Deploy Auralis sync service, Set up Android signing]
    types: [completed]
permissions:
  contents: read
  actions: write
concurrency:
  group: cleanup-${{ github.repository }}
  cancel-in-progress: false
jobs:
  cleanup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Only trusted main source; never check out the triggering run's commit.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - name: Clean published builds, green runs and failures older than ten minutes
        uses: actions/github-script@v8
        with:
          script: |
            const {cleanupCandidates} = require('./tool/release-policy.cjs');
            const {owner,repo} = context.repo;
            const names = ['android.yml','windows.yml','publish-release.yml','deploy-sync.yml','android-signing.yml','cleanup-runs.yml'];
            const runs = [];
            for (const workflow_id of names) {
              try { runs.push(...await github.paginate(github.rest.actions.listWorkflowRuns, {owner,repo,workflow_id,per_page:100})); }
              catch (error) { if (error.status !== 404) throw error; }
            }
            const consumed = new Set();
            for (const run of runs.filter(r => r.path === '.github/workflows/publish-release.yml' && r.conclusion === 'success')) {
              const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {owner,repo,run_id:run.id,per_page:100});
              for (const artifact of artifacts) {
                const match = /^published-([a-f0-9]{40})-([1-9][0-9]*)-([1-9][0-9]*)(?:-([1-9][0-9]*))?$/.exec(artifact.name);
                if (match) { consumed.add(Number(match[2])); consumed.add(Number(match[3])); if (match[4]) consumed.add(Number(match[4])); }
              }
            }
            // Existing published releases also prove older builds were consumed.
            const publishedCommits = new Set();
            const releases = await github.paginate(github.rest.repos.listReleases, {owner,repo,per_page:100});
            for (const release of releases) {
              if (release.draft || release.prerelease || !/^v[0-9]+\.[0-9]+\.[0-9]+$/.test(release.tag_name)) continue;
              const version = release.tag_name.slice(1);
              // Receipts protect new builds (including optional ABI uploads). Only legacy releases lack receipts.
              const [major,minor,patch] = version.split('.').map(Number);
              if (!(major === 0 && (minor < 1 || (minor === 1 && patch < 64)))) continue;
              const assets = new Set(release.assets.map(a => a.name));
              if (!assets.has(`auralis-${version}-windows-x64-setup.exe`) || !['release','development-release','debug'].some(mode => assets.has(`auralis-${version}-android-arm64-v8a-${mode}.apk`))) continue;
              try { publishedCommits.add((await github.rest.repos.getCommit({owner,repo,ref:release.tag_name})).data.sha); }
              catch (error) { if (error.status !== 404) throw error; }
            }
            // Snapshot all pages, active retries and publication receipts before deleting anything.
            for (const run_id of cleanupCandidates(runs, Number(context.runId), Date.now(), consumed, publishedCommits)) {
              try {
                const latest = await github.rest.actions.getWorkflowRun({owner,repo,run_id});
                if (!cleanupCandidates(runs.map(r => r.id === run_id ? latest.data : r), Number(context.runId), Date.now(), consumed, publishedCommits).includes(run_id)) continue;
                await github.rest.actions.deleteWorkflowRun({owner,repo,run_id});
              } catch (error) { if (error.status !== 404) throw error; }
            }
            core.info('Unpublished successful builds, active runs, cancellations and recent failures are retained. Failed runs become eligible ten minutes after completion; scheduled cleanup may run later.');
