name: Windows x64 build and release
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.ci-cache/vcpkg-binaries
      VCPKG_DOWNLOADS: ${{ github.workspace }}/.ci-cache/vcpkg-downloads
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Identify Windows build image
        id: tdlib-image
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ImageVersion)) {
            throw 'The Windows runner image version is required for the TDLib cache key.'
          }
          "version=$env:ImageVersion" >> $env:GITHUB_OUTPUT
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        id: flutter
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
          pub-cache: true
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Validate stable version and tag
        run: ./tool/package.ps1 -ValidateOnly
      - name: Restore Windows and Dart build intermediates
        id: windows-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          key: windows-build-v1-${{ steps.tdlib-image.outputs.version }}-${{ steps.flutter.outputs.CACHE-KEY }}-${{ hashFiles('pubspec.lock', 'windows/CMakeLists.txt', 'windows/runner/**', 'windows/flutter/CMakeLists.txt', 'third_party/**') }}-${{ hashFiles('lib/**', 'assets/**', 'pubspec.yaml') }}
          restore-keys: windows-build-v1-${{ steps.tdlib-image.outputs.version }}-${{ steps.flutter.outputs.CACHE-KEY }}-${{ hashFiles('pubspec.lock', 'windows/CMakeLists.txt', 'windows/runner/**', 'windows/flutter/CMakeLists.txt', 'third_party/**') }}-
          # Rebuild the final bundle; reuse only compatible intermediate output.
          path: |
            .dart_tool/flutter_build/
            .dart_tool/hooks_runner/
            .dart_tool/native_assets/
            build/native_assets/windows/
            build/windows/
            !build/windows/x64/runner/Release/
      - name: Static analysis
        run: flutter analyze --no-pub --fatal-infos
      - name: Compile standalone native smoke check
        run: dart compile kernel tool/native_smoke.dart -o "$env:RUNNER_TEMP/auralis-native-smoke.dill"
      - name: Automated tests
        run: flutter test --no-pub --reporter expanded
      - name: Restore compiled TDLib
        id: tdlib-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          key: tdlib-windows-2022-x64-release-v2-${{ steps.tdlib-image.outputs.version }}-${{ hashFiles('tool/build-tdlib.ps1') }}
          path: |
            native/*.dll
            native/licenses/
            native/build-manifest.json
      # Migrate the two audited v1 workflow keys only with the unchanged builder.
      - name: Restore verified previous TDLib cache
        id: tdlib-previous-cache
        if: steps.tdlib-cache.outputs.cache-hit != 'true' && hashFiles('tool/build-tdlib.ps1') == '3bd38120fd24502f920e57bbec0cad701d81e9e660707d0fe01a37997fcc506a'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          key: tdlib-windows-2022-x64-release-v1-${{ steps.tdlib-image.outputs.version }}-5e62127ef1534812a40462b89b368b2e085b49310a07c06b6c1b83ee6dc91b46
          restore-keys: tdlib-windows-2022-x64-release-v1-${{ steps.tdlib-image.outputs.version }}-dd3ad69f2b8c1b8b18a240341b323fc8f51a81540224546fa0fa684874f27af8
          path: |
            native/*.dll
            native/licenses/
            native/build-manifest.json
      - name: Restore vcpkg downloads and compiled dependencies
        id: vcpkg-cache
        if: steps.tdlib-cache.outputs.cache-hit != 'true' && steps.tdlib-previous-cache.outputs.cache-hit != 'true' && steps.tdlib-previous-cache.outputs.cache-matched-key != format('tdlib-windows-2022-x64-release-v1-{0}-dd3ad69f2b8c1b8b18a240341b323fc8f51a81540224546fa0fa684874f27af8', steps.tdlib-image.outputs.version)
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          key: vcpkg-windows-2022-x64-v1-${{ steps.tdlib-image.outputs.version }}-${{ hashFiles('tool/build-tdlib.ps1') }}
          restore-keys: vcpkg-windows-2022-x64-v1-${{ steps.tdlib-image.outputs.version }}-
          path: |
            .ci-cache/vcpkg-binaries/
            .ci-cache/vcpkg-downloads/
      - name: Prepare vcpkg cache directories
        if: steps.vcpkg-cache.outputs.cache-primary-key != ''
        run: New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE, $env:VCPKG_DOWNLOADS | Out-Null
      - name: Build TDLib from pinned source
        if: steps.tdlib-cache.outputs.cache-hit != 'true' && steps.tdlib-previous-cache.outputs.cache-hit != 'true' && steps.tdlib-previous-cache.outputs.cache-matched-key != format('tdlib-windows-2022-x64-release-v1-{0}-dd3ad69f2b8c1b8b18a240341b323fc8f51a81540224546fa0fa684874f27af8', steps.tdlib-image.outputs.version)
        run: ./tool/build-tdlib.ps1 -Jobs 2
      - name: Save vcpkg downloads and compiled dependencies
        if: ${{ !cancelled() && steps.vcpkg-cache.outputs.cache-primary-key != '' && steps.vcpkg-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}
          path: |
            .ci-cache/vcpkg-binaries/
            .ci-cache/vcpkg-downloads/
      - name: Save compiled TDLib
        if: steps.tdlib-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          key: ${{ steps.tdlib-cache.outputs.cache-primary-key }}
          path: |
            native/*.dll
            native/licenses/
            native/build-manifest.json
      - name: Windows release build
        run: flutter build windows --release --no-pub --dart-define=AURALIS_RELEASE_REPOSITORY=$env:GITHUB_REPOSITORY
      - name: Save Windows and Dart build intermediates
        if: steps.windows-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          key: ${{ steps.windows-cache.outputs.cache-primary-key }}
          path: |
            .dart_tool/flutter_build/
            .dart_tool/hooks_runner/
            .dart_tool/native_assets/
            build/native_assets/windows/
            build/windows/
            !build/windows/x64/runner/Release/
      - name: Native encryption, TDLib, playback, proxy and seek smoke test
        run: |
          dart run tool/native_smoke_repeat.dart `
            "$PWD/build/windows/x64/runner/Release/libmpv-2.dll" `
            "$PWD/native/tdjson.dll"
      - name: Locate Inno Setup
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $probe = Join-Path $env:GITHUB_WORKSPACE "tool/installer-compiler-check.iss"
          $toolDir = Join-Path $env:RUNNER_TEMP "InnoSetup-6.7.3"
          function Test-InnoCompiler([string]$path) {
            if (!(Test-Path -LiteralPath $path -PathType Leaf)) { return $false }
            Write-Host "Checking compiler capabilities: $path"
            $probeOutput = & $path /O- $probe 2>&1
            $succeeded = $LASTEXITCODE -eq 0
            $probeOutput | ForEach-Object { Write-Host $_ }
            return $succeeded
          }
          $iscc = $null
          $candidates = @(
            (Join-Path $toolDir "ISCC.exe"),
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          foreach ($candidate in $candidates) {
            if (Test-InnoCompiler $candidate) {
              $iscc = $candidate
              break
            }
          }
          if (!$iscc) {
            # Use the official release: Chocolatey's catalog can lag behind.
            $installer = Join-Path $env:RUNNER_TEMP "innosetup-6.7.3.exe"
            $installLog = Join-Path $env:RUNNER_TEMP "innosetup-install.log"
            curl.exe --fail --location --retry 3 --retry-delay 2 --connect-timeout 30 `
              --output "$installer" `
              "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe"
            if ($LASTEXITCODE -ne 0) { throw "Failed to download Inno Setup 6.7.3." }
            if ((Get-AuthenticodeSignature $installer).Status -ne 'Valid') {
              throw "Inno Setup installer signature verification failed."
            }
            # An explicit directory prevents reuse of a stale preinstalled path.
            $setupArgs = @(
              '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/ALLUSERS',
              '/NOICONS', '/TASKS=""', "/DIR=`"$toolDir`"", "/LOG=`"$installLog`""
            )
            $setup = Start-Process -FilePath $installer -ArgumentList $setupArgs -Wait -PassThru
            $iscc = Join-Path $toolDir "ISCC.exe"
            if ($setup.ExitCode -ne 0 -or !(Test-InnoCompiler $iscc)) {
              if (Test-Path $installLog) { Get-Content $installLog | Write-Host }
              throw "Inno Setup installation/capability check failed (exit $($setup.ExitCode)): $iscc"
            }
          }
          Write-Host "Using verified Inno Setup compiler: $iscc"
          "ISCC_PATH=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Check custom installer controls and upgrades
        run: |
          python tool/check-windows-installer.py `
            --compiler "$env:ISCC_PATH" --logs "artifacts/installer-ui-check"
          if ($LASTEXITCODE -ne 0) { throw 'Windows installer UI regression check failed.' }
      - name: Save installer diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: auralis-installer-ui-check
          path: artifacts/installer-ui-check/
          if-no-files-found: ignore
      - name: Package ZIP, installer, source and checksums
        run: ./tool/package.ps1 -Installer
      - name: Save development bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: auralis-windows-x64
          path: dist/*
          if-no-files-found: error
      - name: Save UI preview
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-preview
          path: docs/screenshots/*.png
  publish:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: windows-2022
    concurrency:
      group: stable-release-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: auralis-windows-x64
          path: dist
      - name: Publish verified release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tool/publish-release.ps1
