name: Deploy Auralis sync service
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-sync-${{ github.repository }}
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloud/worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AURALIS_SYNC_KEY: ${{ secrets.AURALIS_SYNC_KEY }}
      WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME || 'auralis-sync' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate service and deployment settings
        run: |
          node --test worker.test.mjs
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          [[ "$WORKER_NAME" =~ ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$ ]]
          [[ "$AURALIS_SYNC_KEY" =~ ^[a-f0-9]{64}$ ]]
      - name: Deploy private sync service
        run: |
          set -euo pipefail
          npm exec --yes --package=wrangler@4.30.0 -- wrangler deploy --name "$WORKER_NAME"
          printf '%s' "$AURALIS_SYNC_KEY" | npm exec --yes --package=wrangler@4.30.0 -- wrangler secret put AURALIS_SYNC_KEY --name "$WORKER_NAME"
