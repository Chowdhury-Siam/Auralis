name = "auralis-sync"
main = "worker.mjs"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
AURALIS_VERSION = "0.1.76"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "AuralisRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AuralisRoom"]

# Turso deployments should use deploy.mjs or the in-app setup to install
# TURSO_DATABASE_URL, TURSO_AUTH_TOKEN AURALIS_SYNC_KEY and JWT_SECRET atomically.
